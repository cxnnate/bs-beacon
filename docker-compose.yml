services:
  db:
    container_name: bsbeacon-db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bsbeacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsbeacon}
      POSTGRES_DB: ${POSTGRES_DB:-bsbeacon}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    container_name: bsbeacon-scraper
    build: .
    command: python -m src.ingestion.scraper
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - ./.telegram_session:/app/.telegram_session
    restart: unless-stopped

  processor:
    container_name: bsbeacon-processor
    build: .
    command: python -m src.processing.pipeline
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  bsbeacon-api:
    container_name: bsbeacon-api
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  bsbeacon-dashboard:
    container_name: bsbeacon-dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - bsbeacon-api
    restart: unless-stopped

volumes:
  postgres_data:
