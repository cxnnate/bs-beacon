scraper:
  poll_interval_seconds: 180
  min_message_length: 20

processor:
  poll_interval_seconds: 30
  batch_size: 20
  max_failed_attempts: 3

dedup:
  # Candidate-retrieval cutoff for the NLI guard, not a merge threshold.
  # multilingual-e5 cosine runs high (~0.77 floor for unrelated texts).
  similarity_threshold: 0.88

urgency:
  caps_ratio_threshold: 0.4
  min_exclamation_marks: 3
